[project]
name = "mcp-vision"
version = "0.1.1"
description = "Allow VLMs to call dedicated specialist CV models"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Groundlight AI" }]
license = { text = "MIT License" }
dependencies = [
    "mcp[cli]>=1.6.0",
    "pillow>=13.0.0",
    "scipy>=1.15.2",
    "torch>=2.14.1",
    "transformers>=5.10.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.7.3", "pytest>=9.0.3"]

[project.scripts]
mcp-vision = "mcp_vision:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = ["ruff>=0.7.3", "pytest>=9.0.3"]
